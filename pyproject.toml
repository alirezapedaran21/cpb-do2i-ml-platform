[project]
name = "cpb-do2i-ml-platform"
version = "0.1.0"
description = "Reproducible research platform for forecasting oxygen delivery index during cardiopulmonary bypass."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<4.0",
    "pyyaml>=6.0,<7.0",
    "scikit-learn>=1.5,<2.0",
    "pydantic>=2.8,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.11,<2.0",
    "httpx>=0.27,<1.0",
]
ml = [
    "torch>=2.4,<3.0",
    "mlflow>=2.17,<4.0",
    "dvc>=3.55,<4.0",
    "onnx>=1.17,<2.0",
    "onnxruntime>=1.20,<2.0",
]
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpb_do2i"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
